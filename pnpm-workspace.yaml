packages:
  - "apps/*"
  - "libs/*"
  - "libs/*/*"
allowBuilds:
  nx: true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
  "@parcel/watcher": true
  less: true
  "@nestjs/core": false
  sharp: true
  core-js: true
  "@scarf/scarf": false
  msgpackr-extract: true
  argon2: true
overrides:
  "postcss@<8.5.23": "8.5.23"
  "nanoid@<3.3.18": "3.3.18"
  "sharp@<0.35.5": "0.35.5"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "fast-uri@>=4.0.0 <4.1.5": "4.1.5"
  "@xmldom/xmldom@<0.8.15": "0.8.15"
  "multer@<2.4.0": "2.4.0"
  "qs@<6.16.0": "6.16.0"
  "fastify@<5.12.5": "5.12.5"
  # Una sola copia de Nest en todo el árbol: dos copias de @nestjs/typeorm guardan sus entidades por
  # separado y el DataSource no ve las que registra forFeature (EntityMetadataNotFoundError).
  "@nestjs/common@<11.2.7": "11.2.7"
  "@nestjs/core@<11.2.7": "11.2.7"
  "@nestjs/platform-express@<11.2.7": "11.2.7"
  "find-my-way@<=9.6.0": "9.7.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "js-yaml@>=5.0.0 <5.4.1": "5.4.1"
  "@fastify/static@<=10.1.1": "10.1.2"
  "exceljs>uuid": "11.1.1"
  # pptxgenjs 4.0.1 declara image-size ^1.2.1 pero ningún archivo de su paquete lo importa: el aviso
  # no es alcanzable; se lleva a la versión parcheada solo para dejar la auditoría limpia.
  "image-size@>=1.2.0 <2.0.3": "2.0.4"
  "@fastify/busboy@<3.2.2": "3.2.2"
  "source-map-js@<1.2.2": "1.2.2"
  "proxy-addr@<2.0.8": "2.0.8"
  # Cadena de desarrollo (Nx, webpack-dev-server, @swc/cli): avisos de la auditoría completa.
  "axios@<1.20.0": "1.20.0"
  "compression@<1.8.2": "1.8.2"
  "http-cache-semantics@<=4.2.0": "4.3.0"
  "smol-toml@<=1.8.0": "1.9.1"
  "svgo@>=3.0.0 <3.3.5": "3.3.5"
  "svgo@>=4.0.0 <4.1.0": "4.1.0"
  "postcss-selector-parser@>=7.0.0 <7.1.6": "7.1.6"
  "uuid@<11.1.1": "11.1.1"
  "piscina@<4.9.4": "4.9.4"
  "shell-quote@>=1.8.4 <1.11.0": "1.11.0"
  "@xhmikosr/decompress@>=11.0.0 <11.1.4": "11.1.4"
peerDependencyRules:
  allowedVersions:
    "@fastify/static": "^10.0.0"
# Excepciones de la auditoría: solo avisos sin versión corregida publicada y fuera del código que se despliega.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (ReDoS): llega solo por webpack-dev-server > http-proxy-middleware > micromatch (herramienta
    # de desarrollo de Nx). El aviso pide 3.0.4, que todavía no existe (la última es 3.0.3). Revisar al publicarse.
    - GHSA-vfj7-8cjw-p6xm
