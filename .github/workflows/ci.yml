name: Validación continua

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, seguridad y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm check:architecture
      - run: pnpm lint:all
      - run: pnpm typecheck:all
      - run: pnpm test:unit
      - run: pnpm test:events
      - run: pnpm build:all
      - run: git diff --check

  openapi:
    name: Contratos OpenAPI
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm swagger:validate
