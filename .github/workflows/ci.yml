name: Validación continua

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, seguridad y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      # La auditoría de producción no ve la cadena de compilación (Nx, webpack, swc...): una herramienta
      # vulnerable también ejecuta código en el equipo de desarrollo y en el CI.
      - name: Auditoría completa (incluye la cadena de desarrollo)
        run: pnpm audit --audit-level high
      - run: pnpm check:secrets
      - run: pnpm check:architecture
      - name: Caché de Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs') }}-
      # Scripts y fixtures fuera de Nx: siempre se comprueban (una sola vez).
      - run: pnpm typecheck:scripts
      # En un PR solo se valida lo afectado por el cambio; en main, todo. Ambos usan la caché de Nx.
      - name: Lint, typecheck y build de los proyectos afectados
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm ci:affected
      - name: Lint, typecheck y build completos
        if: github.event_name != 'pull_request'
        run: pnpm lint:all && pnpm typecheck:projects && pnpm build:all
      # Las pruebas importan las librerías compartidas ya compiladas (dist). En un PR solo se construye
      # lo afectado, así que se garantizan siempre (con la caché de Nx son instantáneas si no cambiaron).
      - name: Construir las librerías compartidas
        run: pnpm nx run-many --target=build --projects='shared-*' --parallel=3
      - run: pnpm test:unit
      - run: pnpm test:web
      - run: pnpm test:events
      - run: git diff --check

  coverage:
    name: Cobertura de pruebas unitarias
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construir las librerías compartidas
        run: pnpm nx run-many --target=build --projects='shared-*' --parallel=3
      - name: Cobertura con umbrales mínimos por servicio
        run: pnpm test:coverage

  e2e-smoke:
    name: Smoke E2E (sin backend)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Caché de Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright levanta `nx start web` (compila antes con la caché de Nx) y ejecuta solo el proyecto «smoke».
      - run: pnpm test:e2e:smoke
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tmp/playwright-report
          retention-days: 7

  integration-e2e:
    name: Integración y E2E con servicios reales
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      E2E_BASE_URL: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Caché de Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-integration-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-integration-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - run: pnpm exec playwright install --with-deps chromium
      # Credenciales efímeras: se generan en cada ejecución, se enmascaran y no se guardan en ningún sitio.
      - name: Credenciales efímeras de la prueba
        run: |
          sql_password="Rq-$(openssl rand -hex 12)-aA1!"
          e2e_password="E2e-$(openssl rand -hex 12)-aA1"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$e2e_password"
          {
            echo "CI_SQL_PASSWORD=$sql_password"
            echo "E2E_EMAIL=e2e-admin@example.test"
            echo "E2E_PASSWORD=$e2e_password"
            echo "DOCUMENT_EDITOR_E2E_EMAIL=e2e-admin@example.test"
            echo "DOCUMENT_EDITOR_E2E_PASSWORD=$e2e_password"
          } >> "$GITHUB_ENV"
      - name: SQL Server efímero
        run: |
          docker run -d --name rq-ci-sql \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$CI_SQL_PASSWORD" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
      - name: Levantar el stack completo (infraestructura, bases, migraciones, servicios y web)
        env:
          RQ_USE_NX_CACHE: "1"
          # Los E2E de interfaz se ejecutan contra la web compilada (como en el despliegue): el servidor de
          # desarrollo puede recargar la página a mitad de una prueba y reiniciar el estado de la pantalla.
          RQ_WEB_MODE: start
        run: bash scripts/ci-stack-up.sh
      - name: Integración con bases de datos (7 servicios y Prototypes), Redis, Azurite y RabbitMQ
        run: pnpm test:integration
      # Los servicios con base de datos solo publican sus rutas con la persistencia activa: el contrato se
      # valida aquí, sobre los servicios ya levantados, y no con la base desactivada.
      - name: Contratos OpenAPI de los servicios levantados
        env:
          SWAGGER_USE_RUNNING: "1"
          SWAGGER_SERVICES: gateway identity-service projects-service sources-service documents-service ai-analysis-service workflow-service operations-service
        run: pnpm swagger:validate
      # Cada ruta del Gateway y de los servicios, llamada sin sesión (anónima, token basura y JWT sin firma),
      # debe responder 401/403. Una ruta nueva sin protección rompe el CI.
      - name: Exposición - ninguna ruta responde sin sesión válida
        run: pnpm test:exposure
      - name: Integración real de la generación de imágenes (SQL Server, Redis y Azurite)
        run: pnpm test:integration:prototypes
      - name: E2E de API completo (login, proyecto, documento, exportación, auditoría)
        env:
          # La base es efímera: se conserva el proyecto aprobado con su plan para las pruebas de Ejecución.
          V1_E2E_KEEP_APPROVED: "1"
        run: |
          mkdir -p logs
          set +e
          pnpm test:e2e:v1 2>&1 | tee logs/e2e-v1.log
          exit "${PIPESTATUS[0]}"
      - name: Resumen del E2E de API
        if: failure()
        run: |
          [ -f logs/e2e-v1.log ] || exit 0
          summary="$(sed -E 's/\x1b\[[0-9;]*m//g' logs/e2e-v1.log | grep -v '^\s*$' | tail -n 14 | tr '\n' ' ' | cut -c1-1200)"
          echo "::error title=E2E de API::$summary"
      - name: Datos de prueba para los E2E de interfaz
        run: pnpm documents:editor:e2e:fixture prepare ci
      - name: E2E de interfaz con sesión real
        env:
          # Con el proyecto aprobado garantizado, las pruebas de Ejecución fallan en vez de omitirse.
          E2E_REQUIRE_APPROVED: "1"
        run: pnpm exec playwright test --project=login --project=chromium
      - name: Limpiar datos de prueba
        if: always()
        run: pnpm documents:editor:e2e:fixture cleanup || true
      # Resume en anotaciones (visibles en el PR sin descargar nada) el final de los registros que
      # mencionan un error. GitHub admite 10 anotaciones por paso.
      - name: Resumen de errores del stack
        if: failure()
        run: |
          count=0
          for file in logs/ci-stack/*.log logs/local-auth/*.log; do
            [ -f "$file" ] || continue
            sed -E 's/\x1b\[[0-9;]*m//g' "$file" | grep -qiE "error|failed|cannot|ENOENT|ERR_" || continue
            count=$((count + 1)); [ "$count" -le 9 ] || break
            summary="$(sed -E 's/\x1b\[[0-9;]*m//g' "$file" | grep -iE "error|failed|cannot|ENOENT|ERR_" | tail -n 4 | tr '\n' ' ' | cut -c1-700)"
            echo "::error title=$(basename "$file")::$summary"
          done
      - name: Registros y informe
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-e2e-diagnostico
          path: |
            logs
            tmp/playwright-report
          retention-days: 7
      - name: Detener servicios
        if: always()
        run: bash scripts/local-auth-down.sh || true
