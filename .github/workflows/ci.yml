name: Validación continua

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, seguridad y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check:secrets
      - run: pnpm check:architecture
      - run: pnpm lint:all
      - run: pnpm typecheck:all
      - run: pnpm test:unit
      - run: pnpm test:web
      - run: pnpm test:events
      - run: pnpm build:all
      - run: git diff --check

  openapi:
    name: Contratos OpenAPI
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      NODE_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm swagger:validate
