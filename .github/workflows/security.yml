name: Seguridad de la cadena de suministro

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true

  # Una imagen por aplicación desplegable (las mismas del parámetro `workloads` de Bicep).
  # Prototypes queda fuera mientras no forme parte del cierre técnico de la V1.
  container:
    name: Contenedor ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: Dockerfile
            app: gateway
          - image: identity-service
            dockerfile: Dockerfile
            app: identity-service
          - image: projects-service
            dockerfile: Dockerfile
            app: projects-service
          - image: sources-service
            dockerfile: Dockerfile
            app: sources-service
          - image: documents-service
            dockerfile: Dockerfile
            app: documents-service
          - image: ai-analysis-service
            dockerfile: Dockerfile
            app: ai-analysis-service
          - image: workflow-service
            dockerfile: Dockerfile
            app: workflow-service
          - image: operations-service
            dockerfile: Dockerfile
            app: operations-service
          - image: erp-knowledge-service
            dockerfile: Dockerfile
            app: erp-knowledge-service
          - image: web
            dockerfile: Dockerfile.web
            app: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir ${{ matrix.image }} para escaneo
        run: docker build -f ${{ matrix.dockerfile }} --build-arg APP_NAME=${{ matrix.app }} -t levantamiento-rq-${{ matrix.image }}:security .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: levantamiento-rq-${{ matrix.image }}:security
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
